name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run unit tests, lint, and build debug APK
        run: >
          sh gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: paper-practice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
