name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          PAPER_PRACTICE_KEYSTORE: ${{ runner.temp }}/release.jks
          PAPER_PRACTICE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          PAPER_PRACTICE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          PAPER_PRACTICE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          sh gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          --no-daemon --console=plain

      - name: Verify release signature
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify \
            --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        run: |
          set -euo pipefail
          asset="paper-practice-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="paper-practice-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" \
            "$asset#Android APK" \
            "$asset.sha256#SHA-256 checksum" \
            --title "Paper Practice ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --latest \
            --verify-tag
